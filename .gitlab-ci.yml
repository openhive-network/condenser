stages:
    - test

# AIDEV-driven development (ai/<issue>-..., session/<name>, aidev/integration) is
# verified by the suites in .aidev/project.yaml, not by CI. A push to
# aidev/integration runs no pipeline; one started by hand or through the API does
# (`glab ci run -b aidev/integration`), for its MR into develop.
workflow:
    rules:
      - if: $CI_COMMIT_BRANCH =~ /^(ai|session)\//
        when: never
      - if: $CI_COMMIT_BRANCH == "aidev/integration" && $CI_PIPELINE_SOURCE !~ /^(web|api)$/
        when: never
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
        when: never
      - if: '$CI_COMMIT_BRANCH'

include:
    - project: 'hive/common-ci-configuration'
      ref: develop
      file: '/templates/base.gitlab-ci.yml'

variables:
    # The on-site npm cache (Verdaccio), the value common-ci-configuration's
    # docker_image_jobs template defines. pnpm-lock.yaml names no registry for
    # registry packages, so an install without it uses the public registry.
    NPM_CONFIG_REGISTRY: "http://npm-cache.syncad.com:8080/"

################################# COMMON TEMPLATES #################################

.node-job: &node-job
    image:
        name: $NODE_TEST_TOOLS_IMAGE
        entrypoint: ['']
    tags:
        - public-runner-docker
    only:
        - branches
        - merge_requests
    cache:
        key:
            files:
                - pnpm-lock.yaml
        paths:
            - .pnpm-store/
    before_script:
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile

################################# MERGE REQUESTS #################################

run-unit-tests:
    stage: test
    <<: *node-job
    script:
        - pnpm run ci:test
    coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
    artifacts:
        when: always
        expire_in: 7 days
        paths:
            - jest
        reports:
            junit: jest/junit.xml

run-eslint:
    stage: test
    <<: *node-job
    script:
        - pnpm run ci:eslint
